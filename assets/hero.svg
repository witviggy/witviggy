<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280">
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <rect width="840" height="280" rx="18" fill="#111111"/>
  <rect x="0.5" y="0.5" width="839" height="279" rx="18" fill="none" stroke="#262626"/>

  <text x="44" y="70" class="mono" font-size="13" fill="#FF7A45" letter-spacing="2">AI ENGINEER · CHENNAI, INDIA</text>
  <text x="42" y="126" class="sans" font-size="46" font-weight="700" fill="#EDEDED">Vignesh</text>
  <text x="42" y="178" class="sans" font-size="46" font-weight="700" fill="#EDEDED">Moovendhan<tspan fill="#FF7A45">.</tspan></text>
  <text x="44" y="214" class="sans" font-size="17" fill="#A3A3A3">I build AI agents that talk, reason,</text>
  <text x="44" y="238" class="sans" font-size="17" fill="#A3A3A3">and hold up in production.</text>

  <!-- agent graph -->
  <g stroke="#333333" stroke-width="1.5">
    <line x1="560" y1="80" x2="660" y2="140"/>
    <line x1="660" y1="140" x2="770" y2="90"/>
    <line x1="660" y1="140" x2="600" y2="215"/>
    <line x1="660" y1="140" x2="740" y2="205"/>
    <line x1="560" y1="80" x2="600" y2="215"/>
    <line x1="770" y1="90" x2="740" y2="205"/>
  </g>
  <g stroke="#FF7A45" stroke-width="1.5" fill="none" stroke-dasharray="6 10">
    <path d="M560 80 L660 140 L770 90">
      <animate attributeName="stroke-dashoffset" from="64" to="0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M660 140 L600 215">
      <animate attributeName="stroke-dashoffset" from="0" to="64" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="660" cy="140" r="30" fill="#FF7A45" opacity="0.12">
    <animate attributeName="r" values="24;34;24" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="660" cy="140" r="18" fill="#FF7A45"/>
  <text x="660" y="145" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#111111">LLM</text>
  <g class="mono" font-size="10" fill="#A3A3A3" text-anchor="middle">
    <circle cx="560" cy="80" r="11" fill="#1C1C1C" stroke="#444"/>
    <text x="560" y="58">voice</text>
    <circle cx="770" cy="90" r="11" fill="#1C1C1C" stroke="#444"/>
    <text x="770" y="68">tools</text>
    <circle cx="600" cy="215" r="11" fill="#1C1C1C" stroke="#444"/>
    <text x="600" y="245">rag</text>
    <circle cx="740" cy="205" r="11" fill="#1C1C1C" stroke="#444"/>
    <text x="740" y="235">memory</text>
  </g>
</svg>
