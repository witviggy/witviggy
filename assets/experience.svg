<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330">
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .co { font-size: 19px; font-weight: 700; fill: #EDEDED; }
    .role { font-size: 13px; fill: #A3A3A3; }
    .date { font-size: 11px; letter-spacing: 1px; }
    .item { font-size: 13px; fill: #C9C9C9; }
  </style>
  <rect width="840" height="330" rx="18" fill="#111111"/>
  <rect x="0.5" y="0.5" width="839" height="329" rx="18" fill="none" stroke="#262626"/>

  <text x="36" y="46" class="mono" font-size="12" fill="#6B6B6B" letter-spacing="2">01 / EXPERIENCE</text>

  <line x1="44" y1="84" x2="796" y2="84" stroke="#2E2E2E" stroke-width="2"/>
  <line x1="44" y1="84" x2="300" y2="84" stroke="#FF7A45" stroke-width="2"/>

  <!-- Bonbloc AI -->
  <circle cx="44" cy="84" r="14" fill="#FF7A45" opacity="0.18">
    <animate attributeName="r" values="10;16;10" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="84" r="7" fill="#FF7A45"/>
  <g transform="translate(36,0)">
    <text y="122" class="mono date" fill="#FF7A45">MAR 2025 — SEP 2026</text>
    <text y="150" class="sans co">Bonbloc AI</text>
    <text y="171" class="sans role">Associate Software Engineer · Chennai</text>
    <g class="sans item">
      <text y="204">→ HR + Sales agentic AI suite</text>
      <text y="226">→ 90% faster HR query resolution</text>
      <text y="248">→ 30% sales productivity gain</text>
      <text y="270">→ FinOps agents: questions → SQL</text>
      <text y="292">→ AI tutor for 10k+ learners</text>
    </g>
  </g>

  <!-- Basal AI -->
  <circle cx="306" cy="84" r="7" fill="#111111" stroke="#9A9A9A" stroke-width="2"/>
  <g transform="translate(298,0)">
    <text y="122" class="mono date" fill="#8A8A8A">DEC 2024 — MAR 2025</text>
    <text y="150" class="sans co">Basal AI</text>
    <text y="171" class="sans role">AI &amp; Data Intern · Bengaluru</text>
    <g class="sans item">
      <text y="204">→ Macy's serverless data pipeline</text>
      <text y="226">→ 180+ daily runs over 6 months</text>
      <text y="248">→ Azure Speech + LLM insights</text>
      <text y="270">→ GenAI fashion imagery prototype</text>
      <text y="292">→ ~60% est. per-SKU photo savings</text>
    </g>
  </g>

  <!-- Genpact -->
  <circle cx="568" cy="84" r="7" fill="#111111" stroke="#9A9A9A" stroke-width="2"/>
  <g transform="translate(560,0)">
    <text y="122" class="mono date" fill="#8A8A8A">FEB 2024 — AUG 2024</text>
    <text y="150" class="sans co">Genpact</text>
    <text y="171" class="sans role">Software Intern · Bengaluru</text>
    <g class="sans item">
      <text y="204">→ OpenAI workflow automation</text>
      <text y="226">→ LLM financial doc processing</text>
      <text y="248">→ Anomaly detection pipelines</text>
      <text y="270">→ Azure ETL + real-time streaming</text>
    </g>
  </g>
</svg>
